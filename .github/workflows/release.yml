name: Release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLYMP_STORE_SECRET: ${{ secrets.OLYMP_STORE_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Olymp Helper ${{ github.ref_name }}"
          releaseBody: "Список змін — у цьому описі. Він показується гравцям у повідомленні про оновлення."
          args: --config src-tauri/tauri.release.json
      - name: Єдиний інсталятор зі сталою назвою
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $f = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $f.FullName "Olymp-Helper-Setup.exe"
          gh release upload "${{ github.ref_name }}" "Olymp-Helper-Setup.exe" --clobber
