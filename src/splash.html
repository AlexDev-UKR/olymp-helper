<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><title>Olymp Helper</title><link rel="stylesheet" href="splash.css"></head>
<body>
<div class="card" data-tauri-drag-region>
  <div class="aurora" aria-hidden="true"><i></i><i></i></div>
  <div class="center">
    <div class="logo-wrap"><span class="ring r1"></span><span class="ring r2"></span><img class="logo" id="logo" src="logo.svg" alt=""></div>
    <h1>Вітаємо в Olymp Helper!</h1>
    <div class="sub">Ваш надійний державний помічник штату Olymp</div>
  </div>
  <div class="bottom">
    <div class="loading" id="loading">
      <div class="st" id="st">Ініціалізація…</div>
      <div class="track"><div class="bar" id="bar"></div></div>
    </div>
    <button class="go" id="go" hidden>Розпочати</button>
  </div>
</div>
<script src="splash.js" defer></script>
</body></html>
