<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><title>Olymp Helper</title><link rel="stylesheet" href="splash.css"><script src="guard.js"></script></head>
<body>
<div class="card" data-tauri-drag-region>
  <div class="center">
    <img class="logo" id="logo" src="logo.svg" alt="">
    <h1>Вітаємо в Olymp Helper!</h1>
    <div class="sub">Ваш надійний державний помічник штату Olymp</div>
  </div>
  <div class="bottom">
    <div class="loading" id="loading">
      <div class="st" id="st">Ініціалізація…</div>
      <div class="track"><div class="bar" id="bar"></div></div>
    </div>
    <button class="go" id="go" hidden>Розпочати</button>
  </div>
</div>
<script src="splash.js" defer></script>
</body></html>
